<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WhatsApp Pet</title>
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div class="pet-window">
    <div id="speechBubble" class="speech-bubble hidden">
      <div id="sbCategory" class="category">Category</div>
      <div id="sbSummary" class="summary">Summary text goes here.</div>
      <div id="sbDeadline" class="deadline">Deadline</div>
    </div>
    <div id="petContainer" class="pet-container idle">
      <div class="blob">
        <div class="face">
          <div class="cheek left"></div>
          <div class="eye"></div>
          <div class="mouth"></div>
          <div class="eye"></div>
          <div class="cheek right"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="pet.js"></script>
</body>
</html>
